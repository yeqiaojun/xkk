node:
  cluster: local
  instance_id: 1
  advertise_host: 127.0.0.1
  listen_host: 127.0.0.1
  service_port: 3301
  pro_version: 0
  conf_version: 0

infrastructure:
  etcd_dsn: etcd://127.0.0.1:2379
  mongo_dsn: mongodb://127.0.0.1:27017
  redis_dsn: redis://127.0.0.1:6379
  etcd_lease_ttl_seconds: 15

storage:
  mongo_database: xkk
  mail_collection: player_mails

capacity:
  rpc_pending: 100000
  write_queue: 1024
  max_mails_per_player: 200

runtime:
  rpc_timeout_ms: 3000
  mail_lock_seconds: 5
  shutdown_drain_seconds: 10
  metrics_interval_seconds: 10

log:
  level: info
  stdout: true
  file: logs/public.log
  async_queue_capacity: 8192
